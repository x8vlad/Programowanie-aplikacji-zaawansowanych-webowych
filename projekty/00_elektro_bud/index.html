<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electro Bud</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="assets/style.css" rel="stylesheet" />

</head>
<body>
<main id="app">
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Electro Bud</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="aboutUs.html">About us</a>
                    </li>
                </ul>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" value="" id="checkNativeSwitch" switch>
                <label class="form-check-label" for="checkNativeSwitch">
                    Dark theme
                </label>
            </div>
        </div>
    </nav>


    <div class="container">
        <p class="fs-4 mb-4 mt-3 fw-semibold" id="addiotonalText">Dodaj produkt</p>
        <form id="product-form" class="row g-3">
        <table class="table table-hover table-sm">
            <tbody class="table-group-divider">
            <tr>
                <td>
                    <div class="md-3">
                        <label class="form-label">EAN</label>
                        <input type="number" id="ean" class="form-control" placeholder="23413546" required>
                    </div>
                </td>
                <td>
                    <div class="md-3">
                        <label class="form-label">Nazwa</label>
                        <input type="text" id="nameProduct" class="form-control" placeholder="nazwa" required>
                    </div>
                </td>
                <td>
                    <div class="md-3">
                        <label class="form-label">Kategoria</label>
                        <input type="text" id="category" class="form-control" placeholder="kategoria" required>
                    </div>
                </td>
                <td>
                    <div class="md-3">
                        <label class="form-label">Ilosc</label>
                        <input type="number" id="count" class="form-control" placeholder="ilosc" required>
                    </div>
                </td>
            </tr>
            <tr>

                <td>
                    <div class="md-3">
                        <label class="form-label">Sektor</label>
                        <input type="text" id="sector" class="form-control" placeholder="A/B/C" required>
                    </div>
                </td>
                <td>
                    <div class="md-3">
                        <label class="form-label">Regał</label>
                        <input type="number" id="rack" class="form-control" placeholder="regał" required>
                    </div>
                </td>
                <td>
                    <div class="md-3">
                        <label class="form-label">Półка</label>
                        <input type="number" id="level" class="form-control" placeholder="polka" required>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
            <div class="col-12 mt-4 d-flex justify-content-start">
                <button type="submit" id="addProduct" class="btn btn-dark">Dodaj produkt</button>
            </div>
        </form>

        <hr class="my-4">

        <div class="mb-3">
            <input id="search" type="search" class="form-control" placeholder="Szukaj po EAN lub nazwie">
        </div>

        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th id="idRes">id</th>
                <th id="entRes">EAN</th>
                <th id="nameRes">Nazwa</th>
                <th id="categoryRes">Kategoria</th>
                <th id="countRes">Ilość</th>
                <th id="sectorRes">Sektor</th>
                <th id="rackRes">Regał</th>
                <th id="levelRes">Półka</th>
                <th>Akcje</th>
            </tr>
            </thead>
            <tbody id="products-body">
<!--                <tr>-->
<!--                    <td>id</td>-->
<!--                </tr>-->
            </tbody>
        </table>

        <p id="empty-message" class="text-muted d-none">Brak produktów.</p>
<!--        <div id="res"></div>-->
    </div>

</main>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="public/main.js"></script>
<script type="module" src="assets/style.js"></script>
</body>
</html>
